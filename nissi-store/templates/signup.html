{% extends 'base.html' %}{% block content %}<div class="max-w-md mx-auto px-4 py-10"><h1 class="font-serif2 text-3xl text-center">Create Account</h1><form method="post" class="bg-white p-6 rounded-2xl mt-5 space-y-3">{% csrf_token %}<input name="username" required placeholder="Username e.g ama" class="w-full border rounded-xl px-4 py-3"><input name="phone" placeholder="Phone e.g 055 123 4567" class="w-full border rounded-xl px-4 py-3"><input name="password" type="password" required placeholder="Password" class="w-full border rounded-xl px-4 py-3"><button class="w-full bg-black text-white py-3 rounded-full font-bold">Create Account</button></form><p class="text-center mt-3 text-sm">Already have account? <a href="/login/" class="text-blue-600 underline">Login</a></p></div>{% endblock %}
